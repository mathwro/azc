owner = "mathwro"
repository = "azc"
package = "azc"
binary = "azc"
description = "A fast subscription context switcher for Azure CLI"
homepage = "https://github.com/mathwro/azc"
license = "MIT"
release_branch = "main"
distribution_repository = "mathwro/homebrew-tools"
dispatch_event = "package-release"

[[targets]]
token = "windows_amd64"
runner = "windows-2022"
rust_target = "x86_64-pc-windows-msvc"
archive = "zip"
executable = "azc.exe"

[[targets]]
token = "windows_arm64"
runner = "windows-11-arm"
rust_target = "aarch64-pc-windows-msvc"
archive = "zip"
executable = "azc.exe"

[[targets]]
token = "darwin_amd64"
runner = "macos-15-intel"
rust_target = "x86_64-apple-darwin"
archive = "tar.gz"
executable = "azc"

[[targets]]
token = "darwin_arm64"
runner = "macos-15"
rust_target = "aarch64-apple-darwin"
archive = "tar.gz"
executable = "azc"

[[targets]]
token = "linux_amd64"
runner = "ubuntu-24.04"
rust_target = "x86_64-unknown-linux-musl"
archive = "tar.gz"
executable = "azc"

[[targets]]
token = "linux_arm64"
runner = "ubuntu-24.04-arm"
rust_target = "aarch64-unknown-linux-musl"
archive = "tar.gz"
executable = "azc"
