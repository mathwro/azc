[package]
name = "azc"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A fast subscription context switcher for Azure CLI"
license = "MIT"
repository = "https://github.com/mathwro/azc"
keywords = ["azure", "cli", "tui", "subscription"]
categories = ["command-line-utilities"]

[dependencies]
codepage = "0.1.3"
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
ratatui = "=0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
