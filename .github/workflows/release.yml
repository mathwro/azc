name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to validate in dry-run mode
        required: true
        type: string
      dry_run:
        description: Build and validate without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_METADATA: release.toml

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      owner: ${{ steps.metadata.outputs.owner }}
      repository: ${{ steps.metadata.outputs.repository }}
      package: ${{ steps.metadata.outputs.package }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      stable: ${{ steps.release.outputs.stable }}
      binary: ${{ steps.metadata.outputs.binary }}
      release_branch: ${{ steps.metadata.outputs.release_branch }}
      distribution_repository: ${{ steps.metadata.outputs.distribution_repository }}
      dispatch_event: ${{ steps.metadata.outputs.dispatch_event }}
      metadata: ${{ steps.metadata.outputs.metadata }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - name: Check out full source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Load canonical release metadata
        id: metadata
        shell: bash
        run: python3 scripts/release.py github-outputs --output "$GITHUB_OUTPUT"
      - name: Verify metadata matches repository package
        env:
          RELEASE_METADATA_JSON: ${{ steps.metadata.outputs.metadata }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')"
          package_description="$(sed -n 's/^description = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')"
          package_license="$(sed -n 's/^license = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')"
          package_repository="$(sed -n 's/^repository = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')"
          [[ "$GITHUB_REPOSITORY" == "$(jq -r '.owner + \"/\" + .repository' <<<"$RELEASE_METADATA_JSON")" ]]
          [[ "$package_name" == "$(jq -r .package <<<"$RELEASE_METADATA_JSON")" ]]
          [[ "$package_description" == "$(jq -r .description <<<"$RELEASE_METADATA_JSON")" ]]
          [[ "$package_license" == "$(jq -r .license <<<"$RELEASE_METADATA_JSON")" ]]
          [[ "$package_repository" == "$(jq -r .homepage <<<"$RELEASE_METADATA_JSON")" ]]
      - name: Validate release source
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.metadata.outputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          stable_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)$'
          if [[ "$tag" =~ $stable_pattern ]]; then
            stable=true
            prerelease=false
          elif [[ "$tag" =~ $prerelease_pattern ]]; then
            stable=false
            prerelease=true
          else
            echo "unsupported release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')"
          [[ "$version" == "$package_version" ]] || {
            echo "tag version $version does not match Cargo package version $package_version" >&2
            exit 1
          }
          tag_type="$(git cat-file -t "refs/tags/$tag")"
          [[ "$tag_type" == tag ]] || {
            echo "$tag must be an annotated or signed tag, not a lightweight tag" >&2
            exit 1
          }
          commit="$(git rev-list -n 1 "$tag")"
          [[ "$commit" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor "$commit" "origin/$RELEASE_BRANCH" || {
            echo "$tag is not reachable from $RELEASE_BRANCH" >&2
            exit 1
          }
          if [[ "$DRY_RUN" != "true" ]] && gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "a GitHub release already exists for immutable tag $tag" >&2
            exit 1
          fi
          epoch="$(git show -s --format=%ct "$commit")"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "epoch=$epoch"
            echo "dry_run=$DRY_RUN"
            echo "stable=$stable"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Install Linux musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}
      - name: Build locked release binary
        env:
          AZC_COMMIT_SHA: ${{ needs.validate.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
        run: cargo build --locked --release --target ${{ matrix.rust_target }}
      - name: Run target-native version smoke test
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.rust_target }}/release/${{ matrix.executable }}"
          line="$("$binary" --version)"
          [[ "$line" == "${{ needs.validate.outputs.binary }} ${{ needs.validate.outputs.version }} (commit "*", built "????-??-??")" ]]
          "$binary" --help >/dev/null
      - name: Package and inspect archive
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
          PACKAGE: ${{ needs.validate.outputs.package }}
        run: |
          set -euo pipefail
          mkdir -p staging
          archive="staging/${PACKAGE}_${{ needs.validate.outputs.version }}_${{ matrix.token }}.${{ matrix.archive }}"
          python3 scripts/package.py create \
            --binary "target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" \
            --output "$archive" \
            --executable "${{ matrix.executable }}" \
            --kind "${{ matrix.archive }}" \
            --epoch "$SOURCE_DATE_EPOCH"
          python3 scripts/package.py inspect --archive "$archive" --executable "${{ matrix.executable }}"
      - name: Upload staged archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.token }}
          path: staging/*
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Download all target archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: staging
          merge-multiple: true
      - name: Validate complete staged release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py verify-assets \
            --version "${{ needs.validate.outputs.version }}" \
            --directory staging
          python3 scripts/package.py checksums --directory staging
          python3 scripts/package.py verify-checksums --directory staging
      - name: Upload complete release staging area
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-complete
          path: staging/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.validate.outputs.dry_run != 'true'
    needs: [validate, stage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - name: Download complete staging area
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-complete
          path: staging
      - name: Create and validate draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.validate.outputs.package }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          prerelease=()
          if [[ "${{ needs.validate.outputs.prerelease }}" == true ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$tag" staging/* \
            --draft --verify-tag --title "$PACKAGE $tag" --generate-notes "${prerelease[@]}"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          [[ "$(jq -r .draft <<<"$release")" == true ]]
          [[ "$(jq -r .prerelease <<<"$release")" == "${{ needs.validate.outputs.prerelease }}" ]]
          [[ "$(jq -r .target_commitish <<<"$release")" == "$RELEASE_BRANCH" || "$(jq -r .target_commitish <<<"$release")" == "${{ needs.validate.outputs.commit }}" ]]
          mapfile -t remote < <(jq -r '.assets[] | [.name, .size] | @tsv' <<<"$release" | sort)
          mapfile -t local < <(find staging -maxdepth 1 -type f -printf '%f\t%s\n' | sort)
          [[ "${remote[*]}" == "${local[*]}" ]]
          echo "release_id=$(jq -r .id <<<"$release")" >>"$GITHUB_OUTPUT"
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.validate.outputs.tag }}" --draft=false --latest

  notify:
    if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.stable == 'true'
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify publication and dispatch package update
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_REPOSITORY_TOKEN }}
          DISTRIBUTION_REPOSITORY: ${{ needs.validate.outputs.distribution_repository }}
          DISTRIBUTION_EVENT: ${{ needs.validate.outputs.dispatch_event }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ needs.validate.outputs.tag }}")"
          [[ "$(jq -r .draft <<<"$release")" == false ]]
          [[ "$(jq -r .id <<<"$release")" == "${{ needs.publish.outputs.release_id }}" ]]
          gh api --method POST "repos/$DISTRIBUTION_REPOSITORY/dispatches" \
            -f event_type="$DISTRIBUTION_EVENT" \
            -f client_payload[repository]="$GITHUB_REPOSITORY" \
            -f client_payload[tag]="${{ needs.validate.outputs.tag }}" \
            -F client_payload[release_id]="${{ needs.publish.outputs.release_id }}"
